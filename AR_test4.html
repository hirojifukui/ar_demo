<!DOCTYPE html>
<!-- AR.JS + A-Frame Location based AR demo only with HTML -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Location-based AR Example</title>
    
<!-- A-Frame itself -->
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

<!-- Pure three.js code that the A-Frame components use for location-based AR -->
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.4/three.js/build/ar-threex-location-only.js'></script>

<!-- AR.js A-Frame components -->
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.4/aframe/build/aframe-ar.js'></script>
    
    <style>
      body, html {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #ar-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  
  <script src="./scripts/script.js"></script>

  <body>
    <div id="ar-container">
      <!-- 
        Setup A-Frame scene with AR.js. 
        'sourceType: webcam' means we’ll use the webcam for marker detection.
        'debugUIEnabled: false' hides AR.js’ debug info in the top-left corner.
      -->
        <a-scene
        vr-mode-ui="enabled: false"
		embedded
        arjs='sourceType: webcam; videoTexture: true; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;'>
        
     

        <!-- A-Frame camera -->
            <a-camera gps-new-camera rotation-reader></a-camera>
	    </a-scene>
    </div>
  </body>
</html>
