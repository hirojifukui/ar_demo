<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marker-based AR Example</title>
    
    <!-- A-Frame 1.x -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame (marker-based) -->
    <script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body, html {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #ar-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  
  <body>
    <div id="ar-container">
      <!-- 
        Setup A-Frame scene with AR.js. 
        'sourceType: webcam' means we’ll use the webcam for marker detection.
        'debugUIEnabled: false' hides AR.js’ debug info in the top-left corner.
      -->
      <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
      >
      
        <!-- 
          Marker: for testing, use preset="hiro". 
          You can print out a Hiro marker from AR.js docs, or create a custom marker 
        -->
        <!--<a-marker preset="hiro"> -->
          
          <!-- Example 1: House model -->
          <!-- 
            Suppose your house model is created in Blender and exported as a GLTF or GLB 
            to keep the correct scale. Place it in a 'models/' folder.  
          -->
          <a-entity
            gltf-model="url(models/castle.gltf)"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.1 0.1 0.1"
          ></a-entity>
          
          <!-- Example 2: “Outside Walls” or fences (optional) -->
          <!-- 
            If you have separate walls, you can add them as well. 
            Adjust position and scale so they look correct around the house.
        
          <a-entity
            gltf-model="url(models/outside_walls.glb)"
            position="0 0 0"
            rotation="0 0 0"
            scale="1 1 1"
          ></a-entity>-->
          
        </a-marker>
        
        <!-- A-Frame camera -->
        <a-entity camera></a-entity>
      </a-scene>
    </div>
  </body>
</html>
