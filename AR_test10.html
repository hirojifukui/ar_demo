<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>位置情報取得 & AR 表示 (デバイス回転対応)</title>
  <!-- A-Frame と AR.js を先読み -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; }
    #getLocation, #status { margin: 1rem; }
    #status { white-space: pre-line; }
    #ar-container { display: none; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <h1>ARモデルを表示</h1>
  <button id="getLocation">位置情報を取得してAR開始</button>
  <div id="status"></div>
  <div id="ar-container"></div>

  <script>
    const btn         = document.getElementById('getLocation');
    const statusEl    = document.getElementById('status');
    const arContainer = document.getElementById('ar-container');

    // iOS 13+ 向けにデバイス向き権限をリクエスト
    async function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (e) {
          console.warn('Orientation permission denied', e);
        }
      }
    }

    btn.addEventListener('click', async () => {
      await requestOrientationPermission();

      if (!navigator.geolocation) {
        statusEl.textContent = 'このブラウザは位置情報取得に対応していません。';
        return;
      }

      statusEl.textContent = '位置情報を取得中…';
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => {
          const lat = coords.latitude;
          const lon = coords.longitude;
          statusEl.textContent = `緯度: ${lat.toFixed(6)}\n経度: ${lon.toFixed(6)}`;

          // UI 隠す
          btn.style.display    = 'none';
          statusEl.style.display = 'none';
          arContainer.style.display = 'block';

          // シーン生成
          const scene = document.createElement('a-scene');
          scene.setAttribute('embedded', '');
          scene.setAttribute('vr-mode-ui', 'enabled: false');
          scene.setAttribute('renderer', 'logarithmicDepthBuffer: true');
          scene.setAttribute('arjs', 'sourceType: webcam; embedded: true; gpsMinDistance: 1; gpsMaxDistance: 100; debugUIEnabled: false;');
          scene.style.width  = '100%';
          scene.style.height = '100%';

          // カメラ
          const camera = document.createElement('a-camera');
          camera.setAttribute('gps-camera', '');
          camera.setAttribute('look-controls', '');
          scene.appendChild(camera);

          // 3Dモデル
          const model = document.createElement('a-entity');
          model.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
          model.setAttribute('gltf-model', 'models/castle3.glb');
          model.setAttribute('scale', '1 1 1');
          scene.appendChild(model);

          // 環境光
          const light = document.createElement('a-entity');
          light.setAttribute('light', 'type: ambient; intensity: 1');
          scene.appendChild(light);

          arContainer.appendChild(scene);
        },
        error => {
          statusEl.textContent = `位置情報取得エラー (${error.code}): ${error.message}`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
