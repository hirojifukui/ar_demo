<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deferred Location-based AR</title>
    <!-- A-Frame core library -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #start-ar {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 1em 2em;
        font-size: 1.2em;
        background: rgba(0,0,0,0.8);
        color: #fff;
        border: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <!-- User gesture button to trigger AR initialization -->
    <button id="start-ar">Start AR Experience</button>

    <!-- AR scene without arjs attribute initially -->
    <a-scene
      id="ar-scene"
      embedded
      renderer="logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false">

      <!-- Camera will be enabled for GPS after AR.js loads -->
      <a-camera gps-camera look-controls="enabled: false"></a-camera>

      <!-- Example entity at fixed GPS location -->
      <a-entity
        gps-entity-place="latitude:37.7749; longitude:-122.4194;"
        gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF/Duck.gltf"
        scale="5 5 5"
        animation-mixer>
      </a-entity>

    </a-scene>

    <script>
      document.getElementById('start-ar').addEventListener('click', () => {
        // Dynamically load AR.js only after user gesture
        const script = document.createElement('script');
        script.src = 'https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js';
        script.onload = () => {
          // Initialize AR.js on the scene, triggering location + camera prompts
          document.getElementById('ar-scene').setAttribute(
            'arjs',
            'sourceType: webcam; gpsMinDistance: 1; gpsMaxDistance: 100;'
          );
          // Hide the start button
          document.getElementById('start-ar').style.display = 'none';
        };
        document.head.appendChild(script);
      });
    </script>
  </body>
</html>
