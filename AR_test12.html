<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>位置情報取得 & AR 表示</title>
  <!-- A-Frame と AR.js を先読み -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #getLocation, #status { position: relative; z-index: 10; margin: 1rem; }
    #status { white-space: pre-line; }

    /* 全画面表示コンテナ */
    #ar-container {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 5;
      background: black;
    }

    /* ビデオとキャンバスを全画面にして切り取り表示（cover） */
    #ar-container video,
    #ar-container a-scene,
    #ar-container a-scene canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
    }
    /* シーンはキャンバス透明に */
    #ar-container a-scene canvas {
      background: transparent;
    }
  </style>
</head>
<body>
  <button id="getLocation">位置情報を取得してAR開始</button>
  <div id="status"></div>
  <div id="ar-container"></div>

  <script>
    const btn         = document.getElementById('getLocation');
    const statusEl    = document.getElementById('status');
    const arContainer = document.getElementById('ar-container');

    // iOS向けデバイス向き権限取得
    async function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); }
        catch (e) { console.warn('Orientation permission denied', e); }
      }
    }

    btn.addEventListener('click', async () => {
      await requestOrientationPermission();
      if (!navigator.geolocation) {
        statusEl.textContent = 'このブラウザは位置情報取得に対応していません。';
        return;
      }
      statusEl.textContent = '位置情報を取得中…';

      navigator.geolocation.getCurrentPosition(
        ({ coords }) => {
          const lat = coords.latitude;
          const lon = coords.longitude;
          statusEl.textContent = `緯度: ${lat.toFixed(6)}\n経度: ${lon.toFixed(6)}`;

          // UI を隠す
          btn.style.display      = 'none';
          statusEl.style.display = 'none';
          arContainer.style.display = 'block';

          // シーン生成
          const scene = document.createElement('a-scene');
          scene.setAttribute('embedded', '');
          scene.setAttribute('vr-mode-ui', 'enabled: false');
          scene.setAttribute('renderer', 'logarithmicDepthBuffer: true');
          scene.setAttribute('arjs', 'sourceType: webcam; embedded: true; gpsMinDistance: 1; gpsMaxDistance: 100; debugUIEnabled: false;');

          const camera = document.createElement('a-camera');
          camera.setAttribute('gps-camera', '');
          camera.setAttribute('look-controls', '');
          scene.appendChild(camera);

          const model = document.createElement('a-entity');
          model.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
          model.setAttribute('gltf-model', 'models/castle3.glb');
          model.setAttribute('scale', '5 5 5');
          scene.appendChild(model);

          const light = document.createElement('a-entity');
          light.setAttribute('light', 'type: ambient; intensity: 1');
          scene.appendChild(light);

          arContainer.appendChild(scene);
        },
        error => {
          statusEl.textContent = `位置情報取得エラー (${error.code}): ${error.message}`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
