<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Remap Device Orientation</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js":
        "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #info {
      position: absolute; top: 0; left: 0; z-index: 999;
      background: rgba(0,0,0,0.5); color: #fff; padding: 0.5em;
      max-width: 90%;
    }
    #startBtn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000; padding: 1em 2em; font-size: 1.2em;
      background: #333; color: #fff; border: none; cursor: pointer;
    }
    #video {
      display: none; /* show after camera starts */
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #threeContainer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="info">Tap "Start AR" to begin</div>
  <button id="startBtn">Start AR</button>

  <!-- Camera feed behind the 3D scene -->
  <video id="video" playsinline muted autoplay></video>
  <div id="threeContainer"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const infoDiv = document.getElementById('info');
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const container = document.getElementById('threeContainer');

    let scene, camera, renderer;
    let model, modelParent;
    let deviceOrientationActive = false;

    // A helper to log to the on-screen div
    function setInfo(msg) {
      console.log(msg);
      infoDiv.textContent = msg;
    }

    startBtn.addEventListener('click', () => {
      setInfo("Requesting orientation + camera...");

      // 1) Request orientation (iOS >=13 requires user gesture & permission)
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              deviceOrientationActive = true;
              window.addEventListener('deviceorientation', onDeviceOrientation);
              console.log("Orientation granted!");
            } else {
              console.log("Orientation permission NOT granted:", response);
            }
          })
          .catch(err => {
            console.error("Orientation request error:", err);
          });
      } else {
        // No special request needed for orientation
        deviceOrientationActive = true;
        window.addEventListener('deviceorientation', onDeviceOrientation);
      }

      // 2) Request camera
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          console.log("Camera granted!");
          video.srcObject = stream;
          video.style.display = "block";
          return video.play();
        })
        .then(() => {
          console.log("Camera playing. Setting up 3D scene...");
          startBtn.style.display = "none";
          setInfo("Camera started. Loading model...");
          initThree();
          animate();
        })
        .catch(err => {
          console.error("Camera error:", err);
          setInfo("Camera error: " + err);
        });
    });

    function initThree() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      // We'll position it further away after we know the model's size
      camera.position.set(0, 0, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // A parent group to rotate with device orientation
      modelParent = new THREE.Group();
      scene.add(modelParent);

      // Load the model
      const loader = new GLTFLoader();
      loader.load(
        'https://www.9mtx.com/ar_demo/3D/castle_joined.glb',
        gltf => {
          model = gltf.scene;
          modelParent.add(model);

          // Center it on the origin
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);

          // If your model is lying down, rotate it upright:
          model.rotation.x = -Math.PI / 2;

          // Position the camera from the side (x-axis), or wherever you like
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(maxDim * 2, 0, 0);
          camera.lookAt(0, 0, 0);

          setInfo("Model loaded. Rotate your phone to move the model.");
        },
        undefined,
        err => {
          console.error("Model load error:", err);
          setInfo("Model load error: " + err);
        }
      );

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    // Helper: get screen orientation in degrees, or 0 if unavailable
    function getScreenOrientationDegrees() {
      if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
        return window.screen.orientation.angle; // e.g. 0, 90, 180, 270
      }
      // Some iOS devices may use window.orientation
      if (typeof window.orientation === 'number') {
        return window.orientation; // also 0, 90, -90, 180, etc.
      }
      return 0;
    }

    // Device orientation => rotate modelParent
    function onDeviceOrientation(e) {
      if (!deviceOrientationActive || !modelParent) return;

      // Convert degrees to radians
      let alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;  // Z axis
      let beta  = e.beta  ? THREE.MathUtils.degToRad(e.beta)  : 0;  // X axis
      let gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;  // Y axis

      // 1) Optionally reduce the sensitivity by a factor:
      const sensitivity = 0.75;
      alpha *= sensitivity;
      beta  *= sensitivity;
      gamma *= sensitivity;

      /*
       * 2) Remap angles based on screen orientation.
       *    This helps if the user started in portrait mode, then rotated the phone
       *    to landscape, or vice versa. The phone's "up" axis changes in these cases.
       */
      let screenOrientationDeg = getScreenOrientationDegrees(); // e.g. 0, 90, 180, -90
      // Convert to radians
      let screenOrientation = THREE.MathUtils.degToRad(screenOrientationDeg);

      /*
       * A simple approach:
       *   - If in portrait (0 or 180), use the angles as is (with some sign adjustments if needed).
       *   - If in landscape (±90), swap or shift them so that rotating the phone "clockwise"
       *     changes alpha, etc.
       * Try different permutations below until it matches your mental model.
       */
      let finalAlpha, finalBeta, finalGamma;

      if (screenOrientationDeg === 0) {
        // Portrait
        finalAlpha = 0;  // turn phone left/right => rotation around Y
        finalBeta  = beta;   // tilt phone forward/back => rotation around X
        finalGamma = -gamma; // roll phone => rotation around Z
      }
      else if (screenOrientationDeg === 90) {
        // Landscape turned right
        // You might re-map alpha to -gamma, etc., so rotating phone “clockwise” changes Yaw.
        finalAlpha = beta;   // or -beta
        finalBeta  = -alpha; // or alpha
        finalGamma = gamma;  // or -gamma
      }
      else if (screenOrientationDeg === -90 || screenOrientationDeg === 270) {
        // Landscape turned left
        finalAlpha = -beta;
        finalBeta  = alpha;
        finalGamma = gamma;
      }
      else {
        // e.g. 180 (portrait upside down)
        finalAlpha = -alpha;
        finalBeta  = -beta;
        finalGamma = gamma;
      }

      // 3) Finally, set the rotation on the parent group with an Euler order
      //    that usually feels intuitive. Often 'YXZ' is used for mobile AR.
      modelParent.rotation.set(
        finalBeta,   // X
        finalAlpha,  // Y
        finalGamma,  // Z
        'YXZ'
      );
    }
  </script>
</body>
</html>
