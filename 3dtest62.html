<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fix Flip + Center Model</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js":
        "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #info {
      position: absolute; top: 0; left: 0; z-index: 999;
      background: rgba(0,0,0,0.5); color: #fff; padding: 0.5em;
      max-width: 90%;
    }
    #startBtn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000; padding: 1em 2em; font-size: 1.2em;
      background: #333; color: #fff; border: none; cursor: pointer;
    }
    #video {
      display: none; /* show after camera starts */
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #threeContainer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="info">Tap "Start AR" to begin</div>
  <button id="startBtn">Start AR</button>

  <!-- Camera feed behind the 3D scene -->
  <video id="video" playsinline muted autoplay></video>
  <div id="threeContainer"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const infoDiv = document.getElementById('info');
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const container = document.getElementById('threeContainer');

    let scene, camera, renderer;
    let model, modelParent;

    // We'll store a "locked" alpha value (yaw) while in portrait.
    let alphaLock = null;
    let deviceOrientationActive = false;

    // For slerping quaternions:
    const targetQuaternion = new THREE.Quaternion();

    startBtn.addEventListener('click', () => {
      setInfo("Requesting orientation + camera...");

      // 1) Request orientation (iOS 13+ requires user gesture & permission)
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              deviceOrientationActive = true;
              window.addEventListener('deviceorientation', onDeviceOrientation);
              console.log("Orientation granted!");
            } else {
              console.log("Orientation permission NOT granted:", response);
            }
          })
          .catch(err => {
            console.error("Orientation request error:", err);
          });
      } else {
        // No special request needed for orientation
        deviceOrientationActive = true;
        window.addEventListener('deviceorientation', onDeviceOrientation);
      }

      // 2) Request camera
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          console.log("Camera granted!");
          video.srcObject = stream;
          video.style.display = "block";
          return video.play();
        })
        .then(() => {
          console.log("Camera playing. Setting up 3D scene...");
          startBtn.style.display = "none";
          setInfo("Camera started. Loading model...");
          initThree();
          animate();
        })
        .catch(err => {
          console.error("Camera error:", err);
          setInfo("Camera error: " + err);
        });
    });

    function setInfo(msg) {
      console.log(msg);
      infoDiv.textContent = msg;
    }

    function initThree() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 5);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // A parent group to rotate with device orientation
      modelParent = new THREE.Group();
      scene.add(modelParent);

      // Load the model
      const loader = new GLTFLoader();
      loader.load(
        'https://www.9mtx.com/ar_demo/3D/castle_final.glb',
        gltf => {
          model = gltf.scene;
          modelParent.add(model);

          // Center it on the origin
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);

          // If the model is lying down, rotate it upright (optional)
          // model.rotation.x = -Math.PI / 2; // Only if needed

          // Now place the camera in front of the model (Z-axis) so it's centered
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(0, 0, maxDim * 2);
          camera.lookAt(0, 0, 0);

          setInfo("Model loaded. Should be centered, no 360 flips in portrait!");
        },
        undefined,
        err => {
          console.error("Model load error:", err);
          setInfo("Model load error: " + err);
        }
      );

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    // === Orientation Helpers ===

    // Get screen orientation in degrees (0, 90, 180, -90, etc.)
    function getScreenOrientationDegrees() {
      if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
        return window.screen.orientation.angle; // e.g. 0, 90, 180, 270
      }
      // iOS fallback
      if (typeof window.orientation === 'number') {
        return window.orientation; // e.g. 0, 90, -90, 180
      }
      return 0;
    }

    function isPortrait() {
      const angle = getScreenOrientationDegrees();
      // 0 or 180 => portrait
      return angle === 0 || angle === 180 || angle === -180;
    }

    // === Main Orientation Handler ===

    function onDeviceOrientation(e) {
      if (!deviceOrientationActive || !modelParent) return;

      // Convert degrees to radians
      let alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0; // about Z axis
      let beta  = e.beta  ? THREE.MathUtils.degToRad(e.beta)  : 0; // about X axis
      let gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0; // about Y axis

      // Optionally reduce the magnitude if it feels too sensitive
      const sensitivity = 0.75;
      alpha *= sensitivity;
      beta  *= sensitivity;
      gamma *= sensitivity;

      // 1) Lock alpha in portrait (no yaw spin while phone is upright)
      if (isPortrait()) {
        if (alphaLock === null) {
          alphaLock = alpha;
        }
        alpha = alphaLock;
      } else {
        alphaLock = null; // free alpha in landscape
      }

      // 2) Clamp extreme beta tilts to avoid crossing 90~100+ degrees
      //    which can cause "flips" on some devices.
      const clampVal = Math.PI / 2 - 0.01; // ~89 deg
      if (beta > clampVal) beta = clampVal;
      if (beta < -clampVal) beta = -clampVal;

      // 3) Convert to an Euler then to a quaternion
      //    We'll invert gamma so that rolling left => rolling left in 3D.
      let finalAlpha = alpha;
      let finalBeta  = beta;
      let finalGamma = -gamma;

      const euler = new THREE.Euler(finalBeta, finalAlpha, finalGamma, 'YXZ');
      targetQuaternion.setFromEuler(euler);

      // 4) Smoothly slerp from current orientation to the target to avoid abrupt changes
      //    Increase or decrease 0.3 to control how quickly it snaps to the new orientation.
      modelParent.quaternion.slerp(targetQuaternion, 0.3);
    }
  </script>
</body>
</html>
